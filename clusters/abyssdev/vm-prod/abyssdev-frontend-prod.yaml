# frontend on vm-prod (VPS): applies ../../../apps/frontend/k8s/flux with ${APP_*} from the prod
# ConfigMap. APP_IMAGE_TAG is written by CI on the `deployment` branch (the only branch Flux reads):
# after each GHCR push, the frontend-bump-tag job commits the new tag there, and Flux applies it on
# its next poll. On master it stays a placeholder. Keep exactly one `APP_IMAGE_TAG:` line: CI
# rewrites it with sed.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: abyssdev-frontend-sync-prod
  namespace: flux-system
spec:
  interval: 3m
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Includes the public Traefik Ingress at the bare <domain>. Needs APP_DOMAIN and
  # APP_TLS_CLUSTER_ISSUER in the ConfigMap below before this reaches the cluster.
  path: ./apps/frontend/k8s/flux
  prune: true
  wait: true
  timeout: 5m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: abyssdev-frontend-prod-config
    substitute:
      APP_IMAGE_TAG: "dev"
