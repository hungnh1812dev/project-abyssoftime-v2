apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app-template.fullname" . }}
  namespace: {{ include "app-template.namespace" . }}
  labels:
    app: {{ include "app-template.fullname" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "app-template.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "app-template.fullname" . }}
    spec:
      {{- if .Values.migration.enabled }}
      # Runs `prisma migrate deploy` to completion before the main container starts — see
      # values.yaml's `migratorImage` comment for why this is a separate image from `image`.
      initContainers:
        - name: {{ include "app-template.fullname" . }}-migrate
          image: "{{ .Values.migratorImage.repository }}:{{ .Values.migratorImage.tag }}"
          imagePullPolicy: {{ .Values.migratorImage.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ include "app-template.secretName" . }}
      {{- end }}
      containers:
        - name: {{ include "app-template.fullname" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ include "app-template.secretName" . }}
          ports:
            - name: http
              containerPort: {{ .Values.appPort }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probePath }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.probePath }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
