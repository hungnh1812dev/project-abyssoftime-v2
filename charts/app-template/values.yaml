# Generic defaults only — no app-specific values here. Each consuming app supplies its own
# values file (e.g. apps/cms-api/k8s/values.yaml) with real appName/servicePostfix/image/etc.

# Naming — full service/Deployment name is "<appName>-<servicePostfix>" (see _helpers.tpl).
# Placeholder, non-app-specific defaults below so `helm lint`/`helm template` render valid output
# with no overrides — every real consumer (e.g. apps/cms-api/k8s/values.yaml) overrides all of them.
appName: "app"
servicePostfix: "service"
# Base namespace name — the chart appends "-prod" (see app-template.namespace in _helpers.tpl).
namespaceBase: "default"

replicaCount: 1

image:
  repository: "changeme/app"
  tag: "latest"
  pullPolicy: IfNotPresent

# Migration init container — runs to completion before the main container starts, using a
# separate image built from the same Dockerfile's `migrator` target (the main `runner` image
# deliberately lacks the Prisma schema/CLI/devDependencies needed to run migrations). Set to
# false only for an app with no DB migrations to run.
migration:
  enabled: true

migratorImage:
  repository: "changeme/app"
  tag: "latest-migrate"
  pullPolicy: IfNotPresent

# Port the app listens on (containerPort / probes / Service.targetPort). NOT read from the
# Secret — Helm cannot read a live Secret's value at template-render time, so this must be set
# here and kept in sync BY HAND with whatever env var key inside the Secret actually configures
# the app's listen port (e.g. cms-api's `PORT`).
appPort: 3000

# Secret consumed via envFrom by both the main and (if enabled) migration init containers. Left
# unset, it defaults to "<appName>-<servicePostfix>-secrets" (see _helpers.tpl). This chart never
# creates the Secret itself — it's applied by hand, outside of Helm/helmfile.
secretName: ""

probePath: /health

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

service:
  port: 80
