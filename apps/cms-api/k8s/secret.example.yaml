# Template for cms-api's runtime config/secrets. Committed as a reference — contains no real
# secrets. Copy this to secret.yaml (gitignored, see apps/cms-api/.gitignore), fill in every
# "CHANGE_ME_*" placeholder, generate fresh JWT secrets, then:
#
#   kubectl apply -f apps/cms-api/k8s/secret.yaml
#
# Apply this before the first `helmfile apply` (see apps/cms-api/helmfile.yaml). The Secret name is
# fixed by helmfile-chart-template (<appName>-<serviceName>-secrets-<appEnv>) — don't rename it.
#
# Generate JWT secrets with: openssl rand -base64 32
apiVersion: v1
kind: Namespace
metadata:
  name: abyssoftime-prod
---
apiVersion: v1
kind: Secret
metadata:
  name: abyssoftime-cms-api-secrets-prod
  namespace: abyssoftime-prod
type: Opaque
stringData:
  # ── Server ──────────────────────────────────────────────────────────────────
  PORT: "3000"

  # ── JWT — generate with `openssl rand -base64 32`, one value each ──────────
  JWT_ACCESS_SECRET: "CHANGE_ME_run_openssl_rand_base64_32"
  JWT_REFRESH_SECRET: "CHANGE_ME_run_openssl_rand_base64_32"

  # ── Cookie ───────────────────────────────────────────────────────────────────
  COOKIE_SECURE: "true"
  COOKIE_SAMESITE: "lax"

  # ── CORS — comma-separated exact origins allowed credentialed access, e.g.
  # https://admin.example.com. Required, no default. See docs/documents/cors.md.
  CORS_ORIGINS: "CHANGE_ME_comma_separated_origins"

  # ── Reverse-proxy hops (see docs/documents/auth.md). Default "1" is usually right
  # behind a single ingress-nginx hop — only change if you know you need to.
  TRUST_PROXY: "1"

  # ── Database — Postgres runs in Docker on your MacBook; the k3s VM (VMware Fusion) is
  # bridged directly to the Mac, so pods can reach the Mac's bridge IP with no tunnel needed.
  # Find it on the Mac with `ifconfig` (look for the interface on the same subnet as your
  # k3s node's IP, e.g. `kubectl get nodes -o wide` — the Mac's IP is usually `.1` on that
  # /24). Confirmed reachable from a pod with:
  #   kubectl run pg-test --rm -i --restart=Never --image=busybox:1.36 --command -- \
  #     nc -zv -w3 <mac-bridge-ip> 5432
  # Also confirm the Postgres container actually publishes the port to all interfaces, not
  # just localhost: `docker ps` should show `0.0.0.0:5432->5432/tcp`, not `127.0.0.1:5432->...`.
  DB_HOST: "CHANGE_ME_mac_bridge_ip"
  DB_PORT: "5432"
  DB_NAME: "CHANGE_ME_db_name"
  DB_USERNAME: "CHANGE_ME_db_username"
  DB_PASSWORD: "CHANGE_ME_db_password"

  # ── Storage (default "cloudinary" if unset) — fill in only the provider you use.
  STORAGE_PROVIDER: "cloudinary"
  CLOUDINARY_CLOUD_NAME: "CHANGE_ME_cloudinary_cloud_name"
  CLOUDINARY_API_KEY: "CHANGE_ME_cloudinary_api_key"
  CLOUDINARY_API_SECRET: "CHANGE_ME_cloudinary_api_secret"
  # AWS_REGION: "CHANGE_ME"
  # AWS_S3_BUCKET: "CHANGE_ME"

  # ── Email sender (default "console" — logs emails instead of sending, fine for a
  # first deploy). Set EMAIL_PROVIDER + the matching credentials once you're ready to
  # send real email. See docs/documents/auth.md.
  EMAIL_PROVIDER: "console"
  EMAIL_FROM: "no-reply@example.com"
  FRONTEND_URL: "CHANGE_ME_frontend_url"
  # SMTP_HOST: "CHANGE_ME"
  # SMTP_PORT: "587"
  # SMTP_USER: "CHANGE_ME"
  # SMTP_PASSWORD: "CHANGE_ME"
  # SMTP_SECURE: "false"
  # GMAIL_CLIENT_ID: "CHANGE_ME"
  # GMAIL_CLIENT_SECRET: "CHANGE_ME"
  # GMAIL_REFRESH_TOKEN: "CHANGE_ME"
  # GMAIL_SENDER_EMAIL: "CHANGE_ME"
  # RESEND_API_KEY: "CHANGE_ME"
  # BREVO_API_KEY: "CHANGE_ME"

  # ── Redis (optional refresh-token-blacklist cache, default off) ─────────────
  REDIS_ENABLED: "false"
  # REDIS_URL: "redis://<host>:6379"
