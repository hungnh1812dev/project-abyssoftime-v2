# Public HTTPS entry for cms-api on the k3s-bundled Traefik. All paths go to the Service.
# cert-manager issues the <full-app-name>-tls certificate from the ClusterIssuer in
# ${APP_TLS_CLUSTER_ISSUER}. If APP_HOST is missing from the ConfigMap, Flux substitutes "", and the
# Ingress then matches every hostname, so set it before this reaches the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ${APP_NAME}-${APP_SERVICE_NAME}-${APP_ENV}
  namespace: ${APP_NAMESPACE}-${APP_ENV}
  labels:
    app.kubernetes.io/name: ${APP_NAME}-${APP_SERVICE_NAME}-${APP_ENV}
  annotations:
    cert-manager.io/cluster-issuer: ${APP_TLS_CLUSTER_ISSUER}
    # <middleware namespace>-<middleware name>@kubernetescrd, see middleware.yaml.
    traefik.ingress.kubernetes.io/router.middlewares: ${APP_NAMESPACE}-${APP_ENV}-${APP_NAME}-${APP_SERVICE_NAME}-${APP_ENV}-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ${APP_HOST}
      secretName: ${APP_NAME}-${APP_SERVICE_NAME}-${APP_ENV}-tls
  rules:
    - host: ${APP_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ${APP_NAME}-${APP_SERVICE_NAME}-${APP_ENV}
                # The Service's named port, so no numeric ${APP_PORT} lands here.
                port:
                  name: http
