# Picks the newest app tag. CI tags images <run_number>-<sha7> (plus <tag>-init for the init
# container, which this pattern excludes), so the highest run number wins. `$n` is the regex
# capture group, not a Flux variable — Flux only substitutes the ${VAR} form.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: ${APP_NAME}-${APP_SERVICE_NAME}-${APP_ENV}
  namespace: flux-system
  # Matched by the ImageUpdateAutomation's policySelector.
  labels:
    app.kubernetes.io/name: ${APP_NAME}-${APP_SERVICE_NAME}-${APP_ENV}
spec:
  imageRepositoryRef:
    name: ${APP_NAME}-${APP_SERVICE_NAME}-${APP_ENV}
  filterTags:
    pattern: '^(?P<n>\d+)-[a-f0-9]{7}$'
    extract: '$n'
  policy:
    numerical:
      order: asc
