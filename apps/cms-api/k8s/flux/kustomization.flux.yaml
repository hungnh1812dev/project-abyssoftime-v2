# Flux entry point for cms-api — the only file with values to fill in. Copy it with app/ into the
# GitOps repo (somewhere the bootstrap `flux-system` Kustomization applies it) and replace:
#   <full-app-name>    <app-name>-<app-service-name>-<app-env>, e.g. from the ConfigMap's values
#   <path-to-app-dir>  repo-relative path of the copied app/ dir, e.g. ./apps/<full-app-name>.
#                      Keep it OUTSIDE the bootstrap Kustomization's path (e.g. ./clusters/<name>),
#                      or app/ gets applied a second time without substitution.
#   <initial-tag>      the newest <run_number>-<sha7> tag CI pushed (image automation keeps it
#                      current from then on)
# Flux requires the ConfigMap name and the setter marker as literals, so they can't come from the
# ConfigMap itself. Every ${APP_*} in app/ is substituted from that ConfigMap, except
# APP_IMAGE_TAG, which is set below and rewritten by the ImageUpdateAutomation on each new image.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: <full-app-name>
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: <path-to-app-dir>
  prune: true
  # Report Ready only once the Deployment has rolled out (a failed migration init shows up here).
  wait: true
  timeout: 5m
  postBuild:
    # Created by hand before the first deploy (k8s/configmap.example.yaml). Not optional: a missing
    # ConfigMap fails the reconcile instead of applying unsubstituted names.
    substituteFrom:
      - kind: ConfigMap
        name: <full-app-name>-config
    substitute:
      APP_IMAGE_TAG: "<initial-tag>" # {"$imagepolicy": "flux-system:<full-app-name>:tag"}
