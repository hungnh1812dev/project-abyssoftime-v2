# Commits the ImagePolicy's newest tag to the GitOps repo, rewriting the APP_IMAGE_TAG setter
# marker in ../kustomization.flux.yaml. Uses the `flux-system` GitRepository created by
# `flux bootstrap` (it needs a write deploy key) and its branch; with no update.path it scans the
# whole repo, and policySelector limits it to this app's policy so other apps' markers are untouched.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: ${APP_NAME}-${APP_SERVICE_NAME}-${APP_ENV}
  namespace: flux-system
  labels:
    app.kubernetes.io/name: ${APP_NAME}-${APP_SERVICE_NAME}-${APP_ENV}
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  policySelector:
    matchLabels:
      app.kubernetes.io/name: ${APP_NAME}-${APP_SERVICE_NAME}-${APP_ENV}
  git:
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      messageTemplate: "chore(${APP_NAME}-${APP_SERVICE_NAME}-${APP_ENV}): update image tag"
  update:
    strategy: Setters
