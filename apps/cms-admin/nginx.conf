server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Liveness/readiness probe target for k8s: answered by nginx itself, no file or upstream involved.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SPA fallback — serve index.html for all non-asset routes. API calls go straight to
    # VITE_API_URL (baked in at build time), so nothing is proxied here.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
