# frontend runtime Secret template: the app's config and secrets, loaded into the container via
# envFrom. Placeholders only; never commit real values. Created by hand before the first Flux deploy:
#   cp k8s/secret.example.yaml k8s/secret.yaml   # gitignored; fill in names + values
#   kubectl apply --server-side -f k8s/secret.yaml
# (--server-side: a plain `kubectl apply` would also store every value in plain text in the
# last-applied-configuration annotation.)
# The namespace <app-namespace>-<app-env> must exist first (it's shared with cms-api and cms-admin).
# To change a value later: edit k8s/secret.yaml, re-apply the same way, then
#   kubectl -n <app-namespace>-<app-env> rollout restart deploy/<app-name>-<app-service-name>-<app-env>
# (pods only read the Secret at start).
#
# Rules for values:
# - Quote every value: Secret data must be strings.
# - Optional keys are commented out. Uncomment only the ones you use.
# - Don't set PORT (the image sets 3000) or AUTH_TRUST_HOST (the Deployment sets "true").
#   Project info (APP_*) lives in the ConfigMap (k8s/configmap.example.yaml).
# - cms-api URLs: the frontend server calls cms-api from inside the cluster, so prefer the cms-api
#   Service over the public api.<domain> (no round trip through Traefik):
#     http://<app-name>-cms-api-<app-env>.<app-namespace>-<app-env>.svc.cluster.local:<cms-api APP_PORT>
#   The public https://api.<domain> also works. Browser-side calls don't use these keys.
# Keys the app reads are documented in apps/frontend/.env.example.
apiVersion: v1
kind: Secret
metadata:
  name: <app-name>-<app-service-name>-<app-env>-secrets
  namespace: <app-namespace>-<app-env>
type: Opaque
stringData:
  # Auth.js session secret (e.g. `openssl rand -base64 32`). Required: the server throws without it.
  AUTH_SECRET: "<auth-secret>"
  # cms-api URL for login/refresh/logout (see the cms-api URL note above). The app appends /auth/...
  # and cms-api serves its routes under /api/v1, so use the same path form as the working Vercel value.
  CMS_API_URL: "<cms-api-url>"
  # cms-api GraphQL endpoint: <cms-api-url>/graphql
  GRAPHQL_URL: "<cms-api-url>/graphql"
  # Shared secret cms-api sends to /api/revalidate to purge cached pages
  REVALIDATE_SECRET: "<revalidate-secret>"
  # "production" turns off the dev-only request logging in src/api/*
  NEXT_ENV: "production"
  # Optional: bearer token for GraphQL requests
  # GRAPHQL_TOKEN: "<graphql-token>"
  # Optional: legacy Strapi API token (used when GRAPHQL_TOKEN is unset)
  # STRAPI_API_TOKEN: "<strapi-api-token>"
