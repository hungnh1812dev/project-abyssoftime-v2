name: Project AbyssOfTime CI

on:
  push:
    branches:
      - develop
      - staging
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-detecter:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      cms-api: ${{ steps.changed.outputs.cms-api }}
      cms-admin: ${{ steps.changed.outputs.cms-admin }}
      frontend: ${{ steps.changed.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v4
        id: changed
        with:
          base: ${{ github.event.before }}
          filters: |
            cms-api:
                - 'apps/cms-api/**'
            cms-admin:
                - 'apps/cms-admin/**'
            frontend:
                - 'apps/frontend/**'

      - name: Debug change detection
        if: always()
        run: |
          {
              echo "### Change detection debug"
              echo "- event_name: \`${{ github.event_name }}\`"
              echo "- ref: \`${{ github.ref }}\`"
              echo "- before: \`${{ github.event.before }}\`"
              echo "- after: \`${{ github.event.after }}\`"
              echo "- cms-api changed: \`${{ steps.changed.outputs.cms-api }}\`"
              echo "- cms-admin changed: \`${{ steps.changed.outputs.cms-admin }}\`"
              echo "- frontend changed: \`${{ steps.changed.outputs.frontend }}\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  cms-api-install:
    name: CMS API - Install Deps
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cms-api
    needs: [change-detecter]
    if: needs.change-detecter.outputs.cms-api == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cms-api-${{ hashFiles('apps/cms-api/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cms-api-

      - name: Install dependencies
        run: bun install --frozen-lockfile

  cms-api-lint:
    name: CMS API - Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cms-api
    needs: [cms-api-install]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Restore Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cms-api-${{ hashFiles('apps/cms-api/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cms-api-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  cms-api-test:
    name: CMS API - Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cms-api
    needs: [cms-api-lint]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Restore Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cms-api-${{ hashFiles('apps/cms-api/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cms-api-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit Test
        run: bun run test --coverage

  cms-api-build:
    name: CMS API - Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cms-api
    needs: [cms-api-test]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Restore Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cms-api-${{ hashFiles('apps/cms-api/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cms-api-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

  cms-admin-install:
    name: CMS Admin - Install Deps
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cms-admin
    needs: [change-detecter]
    if: needs.change-detecter.outputs.cms-admin == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cms-admin-${{ hashFiles('apps/cms-admin/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cms-admin-

      - name: Install dependencies
        run: bun install --frozen-lockfile

  cms-admin-lint:
    name: CMS Admin - Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cms-admin
    needs: [cms-admin-install]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Restore Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cms-admin-${{ hashFiles('apps/cms-admin/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cms-admin-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  cms-admin-test:
    name: CMS Admin - Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cms-admin
    needs: [cms-admin-lint]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Restore Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cms-admin-${{ hashFiles('apps/cms-admin/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cms-admin-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit Test
        run: bun run test --coverage

  cms-admin-build:
    name: CMS Admin - Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cms-admin
    needs: [cms-admin-test]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Restore Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cms-admin-${{ hashFiles('apps/cms-admin/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cms-admin-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

  frontend-install:
    name: Frontend - Install Deps
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    needs: [change-detecter]
    if: needs.change-detecter.outputs.frontend == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-frontend-${{ hashFiles('apps/frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-frontend-

      - name: Install dependencies
        run: bun install --frozen-lockfile

  frontend-lint:
    name: Frontend - Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    needs: [frontend-install]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Restore Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-frontend-${{ hashFiles('apps/frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-frontend-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  frontend-test:
    name: Frontend - Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    needs: [frontend-lint]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Restore Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-frontend-${{ hashFiles('apps/frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-frontend-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit Test
        run: bun run test --coverage

  frontend-build:
    name: Frontend - Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    env:
      # `next build` evaluates src/auth.ts's module-level fail-loud check while collecting page
      # data for every route that imports it (even dynamic, non-prerendered ones) — this job never
      # deploys the build, so the value just needs to be set, not match the real Vercel secret.
      AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-build-only-placeholder-not-used-at-runtime' }}
    needs: [frontend-test]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Restore Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-frontend-${{ hashFiles('apps/frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-frontend-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

  # master → GHCR images for the k3s deployment (staging keeps deploying to Render, see below). The
  # two clusters run on different CPUs (vm-dev: arm64 VM on Apple Silicon, vm-prod: amd64 VPS), so
  # every release is 4 images, each built natively on its own runner: <tag>-<arch> (app) and
  # <tag>-<arch>-init (migrations), <tag> = <run_number>-<sha7>, <arch> = amd64 | arm64. Free arm64
  # runners need this repo to stay public.
  cms-api-ghcr-publish:
    name: CMS API Deploy - GHCR (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    environment: Production
    needs: [cms-api-build]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    # Arch-less <run_number>-<sha7>, identical in both legs; cms-api-bump-tag appends each cluster's arch.
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The image repo (e.g. ghcr.io/<owner>/<repo>/cms-api, lowercase) is a repo variable, not code.
      - name: Check image repo variable
        env:
          IMAGE: ${{ vars.CMS_API_IMAGE_REPO }}
        run: |
          if [ -z "$IMAGE" ]; then
            echo "::error::Repository variable CMS_API_IMAGE_REPO is not set"
            exit 1
          fi

      - name: Compute image tag
        id: tag
        run: echo "tag=${{ github.run_number }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build both targets before pushing anything, so a failed build can't leave an app image without
      # its init image. The default docker driver keeps the built images in the local store for the
      # push step below.
      - name: Build runner image
        uses: docker/build-push-action@v6
        with:
          context: apps/cms-api
          target: runner
          push: false
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ vars.CMS_API_IMAGE_REPO }}:${{ steps.tag.outputs.tag }}-${{ matrix.arch }}

      - name: Build migrator image
        uses: docker/build-push-action@v6
        with:
          context: apps/cms-api
          target: migrator
          push: false
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ vars.CMS_API_IMAGE_REPO }}:${{ steps.tag.outputs.tag }}-${{ matrix.arch }}-init

      # `-init` first, so an app image never exists without its init image (the migrations it needs).
      - name: Push images
        env:
          IMAGE: ${{ vars.CMS_API_IMAGE_REPO }}
          TAG: ${{ steps.tag.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker push "$IMAGE:$TAG-$ARCH-init"
          docker push "$IMAGE:$TAG-$ARCH"

  # Keep GHCR storage bounded: each release is 4 versions (app + init, amd64 + arm64), so keeping the
  # newest 20 keeps 5 releases; everything older is deleted, tagged or not. A separate job so the
  # publish matrix doesn't run it twice. Opt-in via the CMS_API_GHCR_CLEANUP repo variable ('true').
  # Needs the package's "Manage Actions access" to give this repo the Admin role.
  cms-api-ghcr-cleanup:
    name: CMS API Deploy - GHCR cleanup
    runs-on: ubuntu-latest
    environment: Production
    needs: [cms-api-ghcr-publish]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push' && vars.CMS_API_GHCR_CLEANUP == 'true'
    permissions:
      packages: write

    steps:
      - name: Resolve package name
        id: pkg
        env:
          IMAGE: ${{ vars.CMS_API_IMAGE_REPO }}
        run: |
          # ghcr.io/<owner>/<package...> → owner=<owner>, name=<package...>
          path="${IMAGE#*/}"
          echo "owner=${path%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${path#*/}" >> "$GITHUB_OUTPUT"

      - name: Delete old image versions
        uses: actions/delete-package-versions@v5
        with:
          owner: ${{ steps.pkg.outputs.owner }}
          package-name: ${{ steps.pkg.outputs.name }}
          package-type: container
          min-versions-to-keep: 20

  # Deploys the tag just pushed to GHCR: commits <tag>-<arch> as APP_IMAGE_TAG (app image
  # <tag>-<arch>, init image <tag>-<arch>-init) in each cluster's app Kustomization on the `deployment`
  # branch, which is the only branch Flux reads (vm-dev: arm64 local VM, vm-prod: amd64 VPS). master itself is never written. No CI loop:
  # this workflow only runs on develop/staging/master pushes, and a GITHUB_TOKEN push never triggers
  # workflows anyway. Plain git + sed, no extra tools. Other manifest changes reach `deployment` by
  # merging master into it by hand.
  cms-api-bump-tag:
    name: CMS API Deploy - Bump Flux tag
    runs-on: ubuntu-latest
    needs: [cms-api-ghcr-publish]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write
    # One bump at a time; queued, never cancelled, so no pushed image is skipped silently.
    concurrency:
      group: cms-api-bump-tag
      cancel-in-progress: false

    steps:
      - name: Checkout deployment
        uses: actions/checkout@v5
        with:
          ref: deployment

      # Each attempt starts from the current origin/deployment and re-applies the edit, so a
      # concurrent push is retried without rebase conflicts. A file already on a newer run number is
      # left alone, so an older run finishing last can't roll the clusters back. sed writes via a temp
      # file (no `sed -i`) so the script behaves the same with GNU and BSD sed.
      - name: Commit APP_IMAGE_TAG to deployment
        env:
          TAG: ${{ needs.cms-api-ghcr-publish.outputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^[0-9]+-[0-9a-f]{7}$ ]]; then
            echo "::error::Unexpected image tag '$TAG' (want <run_number>-<sha7>)"
            exit 1
          fi
          # <cluster file>:<arch its nodes run>
          TARGETS=(
            clusters/abyssdev/vm-dev/abyssdev-apps-develop.yaml:arm64
            clusters/abyssdev/vm-prod/abyssdev-apps-prod.yaml:amd64
          )
          FILES=()
          for t in "${TARGETS[@]}"; do FILES+=("${t%:*}"); done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin deployment
            git reset --hard origin/deployment
            for t in "${TARGETS[@]}"; do
              f=${t%:*}
              want="$TAG-${t##*:}"
              if [ ! -f "$f" ]; then
                echo "::error::$f is not on the deployment branch; merge master into deployment first"
                exit 1
              fi
              cur=$(sed -nE 's/^[[:space:]]*APP_IMAGE_TAG:[[:space:]]*"?([^"#[:space:]]*)"?.*/\1/p' "$f")
              if [[ "$cur" =~ ^([0-9]+)-[0-9a-f]{7}(-(amd64|arm64))?$ ]] && (( BASH_REMATCH[1] >= ${TAG%%-*} )); then
                echo "$f is already on $cur, not replacing it with $want"
                continue
              fi
              sed -E "s/^([[:space:]]*APP_IMAGE_TAG:).*/\1 \"$want\"/" "$f" > "$f.tmp"
              mv "$f.tmp" "$f"
              if [ "$(grep -cE "^[[:space:]]*APP_IMAGE_TAG: \"$want\"$" "$f")" != 1 ]; then
                echo "::error::$f: APP_IMAGE_TAG was not set to $want"
                exit 1
              fi
            done

            if git diff --quiet; then
              echo "Nothing to commit"
              exit 0
            fi
            git commit -m "chore(cms-api): deploy image $TAG" -- "${FILES[@]}"
            if git push origin HEAD:deployment; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), retrying on the new deployment"
          done
          echo "::error::Could not push the tag bump to deployment after 3 attempts"
          exit 1

  deploy-cms-api:
    name: Deploy CMS API
    runs-on: ubuntu-latest
    needs: [cms-api-build]
    environment: Production
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'

    steps:
      - name: Debug deploy trigger condition
        if: always()
        run: |
          echo "ref: ${{ github.ref }}, event_name: ${{ github.event_name }}"
          echo "CMS_API_RENDER_DEPLOY_HOOK set: ${{ vars.CMS_API_RENDER_DEPLOY_HOOK != '' }}"

      - name: Trigger Render Deploy Web Hook
        if: vars.CMS_API_RENDER_DEPLOY_HOOK != ''
        run: curl -fsSL "${{ vars.CMS_API_RENDER_DEPLOY_HOOK }}"

  deploy-cms-admin:
    name: Deploy CMS Admin
    runs-on: ubuntu-latest
    needs: [cms-admin-build]
    environment: Production
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Debug deploy trigger condition
        if: always()
        run: |
          echo "ref: ${{ github.ref }}, event_name: ${{ github.event_name }}"
          echo "CMS_ADMIN_RENDER_DEPLOY_HOOK set: ${{ vars.CMS_ADMIN_RENDER_DEPLOY_HOOK != '' }}"

      - name: Trigger Render Deploy Web Hook
        if: vars.CMS_ADMIN_RENDER_DEPLOY_HOOK != ''
        run: curl -fsSL "${{ vars.CMS_ADMIN_RENDER_DEPLOY_HOOK }}"

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    needs: [frontend-build]
    environment: Production
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Vercel CLI
        run: bun add -g vercel

      - name: Deploy
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
