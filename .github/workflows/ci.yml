name: Project AbyssOfTime CI

on:
  push:
    branches:
      - develop
      - staging
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-detecter:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      cms-api: ${{ steps.changed.outputs.cms-api }}
      cms-admin: ${{ steps.changed.outputs.cms-admin }}
      frontend: ${{ steps.changed.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v4
        id: changed
        with:
          base: ${{ github.event.before }}
          filters: |
            cms-api:
                - 'apps/cms-api/**'
            cms-admin:
                - 'apps/cms-admin/**'
            frontend:
                - 'apps/frontend/**'

      - name: Debug change detection
        if: always()
        run: |
          {
              echo "### Change detection debug"
              echo "- event_name: \`${{ github.event_name }}\`"
              echo "- ref: \`${{ github.ref }}\`"
              echo "- before: \`${{ github.event.before }}\`"
              echo "- after: \`${{ github.event.after }}\`"
              echo "- cms-api changed: \`${{ steps.changed.outputs.cms-api }}\`"
              echo "- cms-admin changed: \`${{ steps.changed.outputs.cms-admin }}\`"
              echo "- frontend changed: \`${{ steps.changed.outputs.frontend }}\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  cms-api-install:
    name: CMS API - Install Deps
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cms-api
    needs: [change-detecter]
    if: needs.change-detecter.outputs.cms-api == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cms-api-${{ hashFiles('apps/cms-api/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cms-api-

      - name: Install dependencies
        run: bun install --frozen-lockfile

  cms-api-lint:
    name: CMS API - Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cms-api
    needs: [change-detecter, cms-api-install]
    if: needs.change-detecter.outputs.cms-api == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Restore Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cms-api-${{ hashFiles('apps/cms-api/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cms-api-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  cms-api-test:
    name: CMS API - Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cms-api
    needs: [change-detecter, cms-api-lint]
    if: needs.change-detecter.outputs.cms-api == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Restore Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cms-api-${{ hashFiles('apps/cms-api/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cms-api-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit Test
        run: bun run test --coverage

  cms-api-build:
    name: CMS API - Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cms-api
    needs: [change-detecter, cms-api-test]
    if: needs.change-detecter.outputs.cms-api == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Restore Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cms-api-${{ hashFiles('apps/cms-api/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cms-api-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

  cms-admin-install:
    name: CMS Admin - Install Deps
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cms-admin
    needs: [change-detecter]
    if: needs.change-detecter.outputs.cms-admin == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cms-admin-${{ hashFiles('apps/cms-admin/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cms-admin-

      - name: Install dependencies
        run: bun install --frozen-lockfile

  cms-admin-lint:
    name: CMS Admin - Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cms-admin
    needs: [change-detecter, cms-admin-install]
    if: needs.change-detecter.outputs.cms-admin == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Restore Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cms-admin-${{ hashFiles('apps/cms-admin/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cms-admin-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  cms-admin-test:
    name: CMS Admin - Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cms-admin
    needs: [change-detecter, cms-admin-lint]
    if: needs.change-detecter.outputs.cms-admin == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Restore Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cms-admin-${{ hashFiles('apps/cms-admin/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cms-admin-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit Test
        run: bun run test --coverage

  cms-admin-build:
    name: CMS Admin - Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cms-admin
    needs: [change-detecter, cms-admin-test]
    if: needs.change-detecter.outputs.cms-admin == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Restore Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cms-admin-${{ hashFiles('apps/cms-admin/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cms-admin-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

  frontend-install:
    name: Frontend - Install Deps
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    needs: [change-detecter]
    if: needs.change-detecter.outputs.frontend == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-frontend-${{ hashFiles('apps/frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-frontend-

      - name: Install dependencies
        run: bun install --frozen-lockfile

  frontend-lint:
    name: Frontend - Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    needs: [change-detecter, frontend-install]
    if: needs.change-detecter.outputs.frontend == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Restore Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-frontend-${{ hashFiles('apps/frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-frontend-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  frontend-test:
    name: Frontend - Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    needs: [change-detecter, frontend-lint]
    if: needs.change-detecter.outputs.frontend == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Restore Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-frontend-${{ hashFiles('apps/frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-frontend-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit Test
        run: bun run test --coverage

  frontend-build:
    name: Frontend - Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    env:
      # `next build` evaluates src/auth.ts's module-level fail-loud check while collecting page
      # data for every route that imports it (even dynamic, non-prerendered ones) — this job never
      # deploys the build, so the value just needs to be set, not match the real Vercel secret.
      AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-build-only-placeholder-not-used-at-runtime' }}
    needs: [change-detecter, frontend-test]
    if: needs.change-detecter.outputs.frontend == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Restore Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-frontend-${{ hashFiles('apps/frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-frontend-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

  # master → GHCR images for the k3s deployment (staging keeps deploying to Render, see below). Only
  # pushes images — rolling them out to k3s stays manual (see apps/cms-api/k8s/helmfile.yaml.gotmpl).
  cms-api-ghcr-publish:
    name: CMS API - Publish Images to GHCR
    runs-on: ubuntu-latest
    needs: [cms-api-build]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build both targets before pushing anything, so a failed or cancelled run can't leave
      # `latest` and `latest-migrate` pointing at different commits. The default docker driver keeps
      # the built images in the local store for the push step below.
      - name: Build runner image
        uses: docker/build-push-action@v6
        with:
          context: apps/cms-api
          target: runner
          push: false
          # Required by the Dockerfile (EXPOSE + default PORT). Keep equal to APP_PORT in k8s/.env.
          build-args: APP_PORT=${{ vars.CMS_API_APP_PORT }}
          labels: org.opencontainers.image.source=https://github.com/hungnh1812dev/project-abyssoftime-v2
          tags: |
            ghcr.io/hungnh1812dev/project-abyssoftime-v2/cms-api:latest
            ghcr.io/hungnh1812dev/project-abyssoftime-v2/cms-api:${{ steps.sha.outputs.short }}

      - name: Build migrator image
        uses: docker/build-push-action@v6
        with:
          context: apps/cms-api
          target: migrator
          push: false
          labels: org.opencontainers.image.source=https://github.com/hungnh1812dev/project-abyssoftime-v2
          tags: |
            ghcr.io/hungnh1812dev/project-abyssoftime-v2/cms-api:latest-migrate
            ghcr.io/hungnh1812dev/project-abyssoftime-v2/cms-api:${{ steps.sha.outputs.short }}-migrate

      # SHA tags first, then `latest-migrate` before `latest` — the app's `latest` never moves ahead
      # of the migrations it needs.
      - name: Push images
        env:
          IMAGE: ghcr.io/hungnh1812dev/project-abyssoftime-v2/cms-api
          SHA: ${{ steps.sha.outputs.short }}
        run: |
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:$SHA-migrate"
          docker push "$IMAGE:latest-migrate"
          docker push "$IMAGE:latest"

  deploy-cms-api:
    name: Deploy CMS API
    runs-on: ubuntu-latest
    needs: [cms-api-build]
    environment: Production
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'

    steps:
      - name: Debug deploy trigger condition
        if: always()
        run: |
          echo "ref: ${{ github.ref }}, event_name: ${{ github.event_name }}"
          echo "CMS_API_RENDER_DEPLOY_HOOK set: ${{ vars.CMS_API_RENDER_DEPLOY_HOOK != '' }}"

      - name: Trigger Render Deploy Web Hook
        if: vars.CMS_API_RENDER_DEPLOY_HOOK != ''
        run: curl -fsSL "${{ vars.CMS_API_RENDER_DEPLOY_HOOK }}"

  deploy-cms-admin:
    name: Deploy CMS Admin
    runs-on: ubuntu-latest
    needs: [cms-admin-build]
    environment: Production
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Debug deploy trigger condition
        if: always()
        run: |
          echo "ref: ${{ github.ref }}, event_name: ${{ github.event_name }}"
          echo "CMS_ADMIN_RENDER_DEPLOY_HOOK set: ${{ vars.CMS_ADMIN_RENDER_DEPLOY_HOOK != '' }}"

      - name: Trigger Render Deploy Web Hook
        if: vars.CMS_ADMIN_RENDER_DEPLOY_HOOK != ''
        run: curl -fsSL "${{ vars.CMS_ADMIN_RENDER_DEPLOY_HOOK }}"

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    needs: [frontend-build]
    environment: Production
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Vercel CLI
        run: bun add -g vercel

      - name: Deploy
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
